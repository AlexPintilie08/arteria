<svg fill="none" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient gradientUnits="userSpaceOnUse" id="flowWave" x1="0" x2="0" y1="0" y2="240">
<stop offset="0%" stop-color="#1B4965" stop-opacity="0.25"></stop>
<stop offset="60%" stop-color="#1B4965" stop-opacity="0.08"></stop>
<stop offset="100%" stop-color="#1B4965" stop-opacity="0.0"></stop>
</linearGradient>
<linearGradient gradientUnits="userSpaceOnUse" id="amberGlow" x1="0" x2="0" y1="0" y2="240">
<stop offset="0%" stop-color="#D97706" stop-opacity="0.18"></stop>
<stop offset="100%" stop-color="#D97706" stop-opacity="0.0"></stop>
</linearGradient>
</defs>
<!-- Clean subtle horizontal baseline rules -->
<line stroke="#F1F5F9" stroke-width="1.5" x1="40" x2="960" y1="60" y2="60"></line>
<line stroke="#F1F5F9" stroke-width="1.5" x1="40" x2="960" y1="120" y2="120"></line>
<line stroke="#F1F5F9" stroke-width="1.5" x1="40" x2="960" y1="180" y2="180"></line>
<line stroke="#E2E8F0" stroke-width="1.5" x1="40" x2="960" y1="240" y2="240"></line>
<!-- Volume Area Landscape Curve (AM & PM Peak Surges) -->
<path d="M 50 240 Q 140 240 180 200 T 260 85 T 330 190 T 450 205 T 580 185 T 710 65 T 790 140 T 890 235 L 950 240 L 950 240 L 50 240 Z" fill="url(#flowWave)"></path>
<path d="M 50 240 Q 140 240 180 200 T 260 85 T 330 190 T 450 205 T 580 185 T 710 65 T 790 140 T 890 235 L 950 240" stroke="#1B4965" stroke-linejoin="round" stroke-width="2.5"></path>
<!-- Delay Trajectory Line (Amber Spline with sudden steep inflection at bottlenecks) -->
<path d="M 50 240 C 150 240 200 220 250 110 C 275 60 290 80 320 180 C 370 215 480 210 560 190 C 640 170 680 75 715 45 C 750 35 770 120 830 200 C 880 235 920 240 950 240" fill="none" stroke="#D97706" stroke-linecap="round" stroke-width="3"></path>
<!-- Bottleneck Highlight 1: AM Inbound Inflow -->
<circle cx="265" cy="85" fill="#D97706" r="5" stroke="#FFFFFF" stroke-width="2"></circle>
<line opacity="0.6" stroke="#D97706" stroke-dasharray="3 3" stroke-width="1.5" x1="265" x2="265" y1="85" y2="240"></line>
<!-- Callout Card 1 -->
<g transform="translate(195, 20)">
<rect fill="#FEF3C7" height="34" rx="6" stroke="#FDE68A" width="140"></rect>
<text fill="#92400E" font-family="Space Grotesk" font-size="11" font-weight="600" text-anchor="middle" x="70" y="21">AM Surge: School &amp; Office</text>
</g>
<!-- Bottleneck Highlight 2: PM Reverse Commute Inflow -->
<circle cx="715" cy="45" fill="#D97706" r="5" stroke="#FFFFFF" stroke-width="2"></circle>
<line opacity="0.6" stroke="#D97706" stroke-dasharray="3 3" stroke-width="1.5" x1="715" x2="715" y1="45" y2="240"></line>
<!-- Callout Card 2 -->
<g transform="translate(645, 0)">
<rect fill="#FEF3C7" height="34" rx="6" stroke="#FDE68A" width="140"></rect>
<text fill="#92400E" font-family="Space Grotesk" font-size="11" font-weight="600" text-anchor="middle" x="70" y="21">PM Critical Spillback Point</text>
</g>
<!-- Time Progression Markers -->
<text fill="#64748B" font-family="Manrope" font-size="12" font-weight="500" x="60" y="270">06:00</text>
<text fill="#1B4965" font-family="Space Grotesk" font-size="12" font-weight="600" x="250" y="270">08:30 (AM Peak)</text>
<text fill="#64748B" font-family="Manrope" font-size="12" font-weight="500" x="490" y="270">12:00 (Midday)</text>
<text fill="#1B4965" font-family="Space Grotesk" font-size="12" font-weight="600" x="700" y="270">17:30 (PM Peak)</text>
<text fill="#64748B" font-family="Manrope" font-size="12" font-weight="500" x="910" y="270">21:00</text>
</svg>